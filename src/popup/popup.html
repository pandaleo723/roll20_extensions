<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Roll20 Utils Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      This page is both the toolbar popup and the options page (manifest "options_ui", opened
      in a tab). Narrow (popup): one column. Wide (tab): two columns, see popup.css.
      Text in [data-i18n] elements comes from R20U.UI_STRINGS (src/shared/settings.js).
    -->
    <header class="page-head">
      <div class="title-row">
        <h1>Roll20 Utils Extension</h1>
        <!-- Popup only (hidden in the wide options tab): opens the options page -->
        <button type="button" id="openOptions" class="link-btn" data-i18n="allSettings"></button>
      </div>
      <p class="hint" data-i18n="popupHint"></p>

      <!-- Beta notice; text and links filled by popup.js (R20U.UI_STRINGS.beta*) -->
      <div class="beta" id="beta"></div>
    </header>

    <div class="layout">
    <div class="col col-general">
    <h2 data-i18n="settings"></h2>

    <label for="lang" data-i18n="language"></label>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>

    <label class="check">
      <input type="checkbox" id="showAltName" />
      <span data-i18n="showAltName"></span>
    </label>
    </div>

    <div class="col col-modules">
    <h2 data-i18n="modulesTitle"></h2>

    <!-- One card per module (R20U.MODULES); name/description/switch filled by popup.js. -->
    <section class="module" data-module="spells">
      <label class="module-head">
        <input type="checkbox" class="module-toggle" />
        <span class="module-name"></span>
      </label>
      <p class="hint small module-desc"></p>
      <div class="module-settings">
        <label class="check">
          <input type="checkbox" id="autoClass" />
          <span data-i18n="autoClass"></span>
        </label>
        <p class="hint small" data-i18n="autoClassHint"></p>

        <!-- Manual class filter: hidden while auto-detect is on; click the heading to fold it -->
        <details id="classBox" class="class-box" open>
          <summary data-i18n="manualClass"></summary>
          <div id="classes" class="class-grid"></div>
          <p class="hint small" data-i18n="manualClassHint"></p>
        </details>
      </div>
    </section>

    <section class="module" data-module="items">
      <label class="module-head">
        <input type="checkbox" class="module-toggle" />
        <span class="module-name"></span>
      </label>
      <p class="hint small module-desc"></p>
    </section>

    <section class="module" data-module="traits">
      <label class="module-head">
        <input type="checkbox" class="module-toggle" />
        <span class="module-name"></span>
      </label>
      <p class="hint small module-desc"></p>
    </section>
    </div>
    </div>

    <p id="saved" class="hint small"></p>

    <!-- Debug tool: hidden in Chrome Web Store installs (see popup.js), kept for local/unpacked use -->
    <details id="debug">
      <summary data-i18n="jsonFill"></summary>
      <p class="hint" data-i18n="jsonHint"></p>
      <label for="data" data-i18n="jsonLabel"></label>
      <textarea id="data" spellcheck="false"></textarea>
      <div class="buttons">
        <button id="fill" data-i18n="fill"></button>
        <button id="sample" class="secondary" data-i18n="sample"></button>
      </div>
      <pre id="status"></pre>
    </details>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
