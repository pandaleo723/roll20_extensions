<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roll20 Sheet Filler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Roll20 Sheet Filler</h1>
    <label for="lang">Spell language / 法术语言</label>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <p class="hint">Use the 📖 buttons in the sheet's Cantrips section to pick a spell.</p>

    <hr />
    <p class="hint">Or fill whole-sheet fields: paste JSON below, then click Fill.</p>

    <label for="data">Character data (JSON)</label>
    <textarea id="data" spellcheck="false"></textarea>

    <div class="buttons">
      <button id="fill">Fill sheet</button>
      <button id="sample" class="secondary">Load sample</button>
    </div>

    <pre id="status"></pre>

    <script src="popup.js"></script>
  </body>
</html>
